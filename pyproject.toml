[project]
name = "cv-intro"
version = "0.1.0"
description = "Intro-to-computer-vision guest lecture demos"
readme = "README.md"
authors = [
    { name = "Mohammed Mahyoub", email = "mahyoubm@amazon.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "num2words>=0.5.14",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "rfdetr>=1.9.2",
    "supervision>=0.30.0",
    "torch>=2.13.0",
    "transformers>=5.15.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
]
